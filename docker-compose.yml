# Docker Compose orchestration for Cusin Gallery.
#
# Service topology (matches nginx/conf.d/cusin.conf routing):
#   nginx    - public edge proxy, binds host ports 80/443
#   web      - Next.js storefront (SSR, not exposed to host directly)
#   backend  - Django/Gunicorn API (not exposed to host directly)
#   db       - PostgreSQL (not exposed to host by default)
#
# Usage:
#   1. cp .env.example .env   (repo root) and fill in real values
#   2. docker compose build
#   3. docker compose up -d
#   4. docker compose exec backend python manage.py migrate
#   5. docker compose exec backend python manage.py createsuperuser
#
# Migrations are run explicitly as a one-off command (step 4), never
# automatically on container start -- see docker/backend/Dockerfile.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile
      args:
        # Optional PyPI mirror for networks where pypi.org is slow or
        # blocked (see docs/DEPLOY.md, section 23). Empty = the default
        # index; no mirror is assumed or hard-coded anywhere.
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Explicit discrete DB vars as a fallback path (see
      # config/settings/base.py) -- POSTGRES_HOST here is the Compose
      # service name "db", which only resolves inside the Compose network.
      POSTGRES_HOST: db
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_ANALYTICS_SCRIPT_URL: ${ANALYTICS_SCRIPT_URL:-}
        NEXT_PUBLIC_ANALYTICS_SITE_ID: ${ANALYTICS_SITE_ID:-}
        NEXT_PUBLIC_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        # Optional npm registry mirror (same idea as PIP_INDEX_URL above).
        NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-}
    restart: unless-stopped
    environment:
      INTERNAL_API_URL: http://backend:8000
      SITE_ORIGIN: ${VITE_SITE_ORIGIN:-https://cusin.ir}
      HOSTNAME: 0.0.0.0
      PORT: 3000
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      # - "${HTTPS_PORT:-443}:443"   # uncomment once HTTPS is configured, see nginx/conf.d/cusin.conf
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
      # - certbot_certs:/etc/letsencrypt:ro   # uncomment once HTTPS is configured
    depends_on:
      - backend
      - web

volumes:
  postgres_data:
  static_volume:
  media_volume:
